name: Update playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_playlist.py"
      - ".github/workflows/update-playlist.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build filtered playlist
        run: python build_playlist.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u8
          git diff --cached --quiet || git commit -m "Update playlist"
          git push
